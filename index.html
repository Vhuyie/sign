<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signature Pad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    canvas {
      border: 2px solid #000;
      border-radius: 8px;
      touch-action: none; /* prevents scrolling while drawing */
    }

    .buttons {
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    img {
      margin-top: 15px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h2>Sign Below ✍️</h2>

  <canvas id="signaturePad" width="400" height="200"></canvas>

  <div class="buttons">
    <button onclick="clearPad()">Clear</button>
    <button onclick="saveSignature()">Save</button>
  </div>

  <h3>Saved Signature:</h3>
  <img id="output" />

  <script>
    const canvas = document.getElementById("signaturePad");
    const ctx = canvas.getContext("2d");

    let drawing = false;

    // Get correct position (mouse or touch)
    function getPosition(e) {
      const rect = canvas.getBoundingClientRect();

      if (e.touches) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top
        };
      } else {
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }
    }

    function startDrawing(e) {
      drawing = true;
      draw(e);
    }

    function stopDrawing() {
      drawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!drawing) return;

      e.preventDefault(); // stops scrolling on mobile

      const pos = getPosition(e);

      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "black";

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    // Mouse events
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mousemove", draw);

    // Touch events
    canvas.addEventListener("touchstart", startDrawing);
    canvas.addEventListener("touchend", stopDrawing);
    canvas.addEventListener("touchmove", draw);

    // Clear canvas
    function clearPad() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById("output").src = "";
    }

    // Save signature
    function saveSignature() {
      const dataURL = canvas.toDataURL("image/png");
      document.getElementById("output").src = dataURL;

      // Example: log or send to server
      console.log(dataURL);
    }
  </script>

</body>
</html>
